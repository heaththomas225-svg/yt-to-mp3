# Purphex on macOS and Linux: builds the shared core and the full desktop app on real Windows, macOS (Apple silicon and Intel) and Linux machines,
# starts the app on each one and keeps a picture of its window, and packages it (macOS: Purphex.app in a zip; Linux: a tar.gz).
# Pushing a tag named desktop-v* publishes the packages as a GitHub release (a beta).
name: Cross-platform

on:
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths: ['*.cs', 'creative/**', 'logo.png', 'cross/**', '.github/workflows/cross-platform.yml']
  pull_request:
    paths: ['*.cs', 'cross/**', '.github/workflows/cross-platform.yml']
  workflow_dispatch:

jobs:
  core:
    name: Core on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-13, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDL_AUDIODRIVER: dummy   # the cloud machines have no speakers: SDL plays into a dummy device at real speed
      PURPHEX_MUTE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the core
        run: dotnet build cross/Purphex.Core/Purphex.Core.csproj -c Release -nologo
      - name: Linux sound and window libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libasound2t64 libpulse0 libx11-6 libxext6 libxcursor1 libxi6 libxrandr2 libxss1 libxfixes3 libice6 libsm6 libfontconfig1 libwayland-client0 libdrm2 libgbm1 > /dev/null
          so=$(find ~/.nuget/packages/ultz.native.sdl -path '*linux-x64*' -name 'libSDL2*.so*' | head -1); echo "SDL: $so"; [ -n "$so" ] && ldd "$so" | grep 'not found' || echo 'SDL: every library it needs is here'
      - name: Smoke test (every plugin, a rendered song, loudness, WAV, live playback)
        run: dotnet run --project cross/Purphex.Smoke/Purphex.Smoke.csproj -c Release -- smoke-out
      - name: Keep the rendered mix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: smoke-out/purphex-smoke.wav
          if-no-files-found: ignore

  desktop:
    name: App for ${{ matrix.rid }}
    permissions:
      contents: write   # publishing the beta release on a desktop-v* tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, pkg: Purphex-Linux-x64 }
          - { os: macos-latest, rid: osx-arm64, pkg: Purphex-macOS-AppleSilicon }
          - { os: macos-13, rid: osx-x64, pkg: Purphex-macOS-Intel }
    runs-on: ${{ matrix.os }}
    env:
      SDL_AUDIODRIVER: dummy
      PURPHEX_MUTE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the app
        run: dotnet publish cross/Purphex.Desktop/Purphex.Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -nologo -o out/Purphex
      - name: Linux sound and window libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libasound2t64 libpulse0 libx11-6 libxext6 libxcursor1 libxi6 libxrandr2 libxss1 libxfixes3 libice6 libsm6 libfontconfig1 libwayland-client0 libdrm2 libgbm1 > /dev/null
          so=$(find ~/.nuget/packages/ultz.native.sdl -path '*linux-x64*' -name 'libSDL2*.so*' | head -1); echo "SDL: $so"; [ -n "$so" ] && ldd "$so" | grep 'not found' || echo 'SDL: every library it needs is here'
      - name: Start the app and take a picture of its window (Linux)
        continue-on-error: true   # the packages are still made; the pictures show whether it started
        if: runner.os == 'Linux'
        timeout-minutes: 4
        run: |
          chmod +x out/Purphex/Purphex
          PURPHEX_SNAP="$PWD/shot-converter.png;20" xvfb-run -a -s "-screen 0 1600x1000x24" out/Purphex/Purphex
          PURPHEX_SNAP="$PWD/shot-studio.png;30" PURPHEX_SNAP_CLICK="PURPHEX MUSIC" xvfb-run -a -s "-screen 0 1600x1000x24" out/Purphex/Purphex
      - name: Start the app and take a picture of its window (macOS)
        continue-on-error: true   # the packages are still made; the pictures show whether it started
        if: runner.os == 'macOS'
        timeout-minutes: 4
        run: |
          PURPHEX_SNAP="$PWD/shot-converter.png;20" out/Purphex/Purphex
          PURPHEX_SNAP="$PWD/shot-studio.png;30" PURPHEX_SNAP_CLICK="PURPHEX MUSIC" out/Purphex/Purphex
      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.rid }}
          path: shot-*.png
          if-no-files-found: ignore
      - name: Package (macOS app)
        if: runner.os == 'macOS'
        run: |
          APP=Purphex.app; mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          cp -R out/Purphex/. $APP/Contents/MacOS/
          mkdir icon.iconset
          for s in 16 32 128 256 512; do sips -z $s $s logo.png --out icon.iconset/icon_${s}x${s}.png > /dev/null; d=$((s*2)); sips -z $d $d logo.png --out icon.iconset/icon_${s}x${s}@2x.png > /dev/null; done
          iconutil -c icns icon.iconset -o $APP/Contents/Resources/Purphex.icns
          VER=$(grep -o 'const string Version = "[0-9.]*"' YtToMp3.cs | grep -o '[0-9][0-9.]*')
          sed "s/__VERSION__/$VER/g" cross/packaging/Info.plist > $APP/Contents/Info.plist
          codesign --force --deep -s - $APP   # an ad-hoc signature (Apple silicon will not start unsigned programs)
          ditto -c -k --keepParent $APP ${{ matrix.pkg }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg/Purphex; cp -R out/Purphex/. pkg/Purphex/; cp logo.png pkg/Purphex/purphex.png
          cp cross/packaging/purphex.desktop cross/packaging/install.sh pkg/Purphex/; chmod +x pkg/Purphex/install.sh pkg/Purphex/Purphex
          tar -C pkg -czf ${{ matrix.pkg }}.tar.gz Purphex
      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: ${{ matrix.pkg }}.*
      - name: Publish the beta (tags only)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: Purphex for macOS and Linux (beta) ${{ github.ref_name }}
          body_path: cross/packaging/BETA.md
          files: ${{ matrix.pkg }}.*
